[project]
name = "forecast-vintage-epf"
version = "0.1.0"
description = "Reproduction companion for Okauchi & Chun, 'Dissemination-aware weather forecast vintages for day-ahead electricity price forecasting in Japan' (manuscript under review)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Ryota Okauchi", email = "ryoutaokauchi@g.ecc.u-tokyo.ac.jp" },
    { name = "Pang-jo Chun" },
]
keywords = [
    "electricity-price-forecasting",
    "forecast-vintage",
    "gate-closure",
    "dissemination-time",
    "day-ahead-market",
    "value-of-information",
    "imbalance-settlement",
    "renewable-price-floor",
    "solar-curtailment",
    "jepx",
    "walk-forward-cross-validation",
    "diebold-mariano",
    "equivalence-testing",
    "pre-registration",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

# Exactly the import surface of `alg/` and `scripts/` — nothing the
# shipped code does not import. Versions match the software block
# declared in the paper's code-and-data-availability statement; loose
# upper bounds keep the lockfile re-resolvable on minor patch releases.
dependencies = [
    "numpy>=2.2,<3.0",
    "polars>=1.18,<2.0",
    "scipy>=1.15,<2.0",
    "scikit-learn>=1.6,<2.0",
    "statsmodels>=0.14,<0.15",
    "xgboost>=2.1,<3.0",
    "matplotlib>=3.10,<4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "requests>=2.32",
    "openpyxl>=3.1",
    "tenacity>=9.0",
    "jpholiday>=0.1.10",
]

[project.optional-dependencies]
# GRIB2 decoding for the MSM-GPV extraction (`make extract`). The
# `eccodeslib` wheel bundles the ecCodes binary library, so no system
# package is needed.
geo = [
    "eccodes>=2.40",
    "eccodeslib>=2.43",
]

# Development tools (linting, testing). Not required for reproduction.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/UT-Team-Chun/forecast-vintage-epf"
Repository = "https://github.com/UT-Team-Chun/forecast-vintage-epf"
Issues = "https://github.com/UT-Team-Chun/forecast-vintage-epf/issues"

# ============================================================
# Build system
# ============================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alg"]

# ============================================================
# Tool configurations
# ============================================================
[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4"]
ignore = ["E501", "E731", "E741", "B008", "C901"]

[tool.ruff.format]
# `alg/` and `scripts/` are VERBATIM extractions from the authors' research
# repository -- the transitive import closure of the published analyses, plus
# one script per analysis phase. Reformatting them here would silently fork the
# two copies and make a diff between the repositories meaningless, so the
# formatter leaves them alone. Lint (`ruff check`) still runs over everything.
exclude = ["alg/**", "scripts/**"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*.py" = ["E402", "F401", "B007", "C408", "F841", "I001"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
